name: PR 校验
on:
  pull_request:
    branches: [v1/source]
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: 主题包校验
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get changed themes
        id: changed
        run: |
          # 获取 PR 中变更的文件，提取涉及的主题文件夹名
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # 提取 themes/ 下的主题文件夹名
          THEMES=$(echo "$CHANGED_FILES" \
            | grep '^themes/' \
            | cut -d'/' -f2 \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//')

          echo "themes=$THEMES" >> $GITHUB_OUTPUT
          echo "Themes to validate: $THEMES"

      - name: Validate themes
        if: steps.changed.outputs.themes != ''
        run: node .scripts/validate.mjs --themes "${{ steps.changed.outputs.themes }}"

      - name: No themes changed
        if: steps.changed.outputs.themes == ''
        run: echo "No theme folders were changed, skipping validation."
