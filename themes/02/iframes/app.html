<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>musicFree Theme</title>
	<style>
		html,
		body {
			position: fixed;
			padding: 0;
			margin: 0;
			overflow: hidden;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background-color: #03031C;
		}

		.image-container {
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			background-color: #03031C;
		}

		.image-container img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			filter: brightness(0.7);
		}
	</style>
</head>

<body>
	<div class="image-container">
		<img src="@/imgs/preview.webp" alt="Preview" />
	</div>
</body>

</html>
